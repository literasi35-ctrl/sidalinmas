<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Informasi SIDALMAS</title>
    <!-- Favicon / Ikon Tab -->
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Linmas_Logo.png/960px-Linmas_Logo.png">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        /* Layar Loading */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #ffffff;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        
        /* Animasi Spinner */
        .spinner {
            width: 52px;
            height: 52px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top: 4px solid #0d9488;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 18px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #f8fafc;
        }
        
        .loading-desc {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 6px;
        }
        
        /* Frame Aplikasi */
        #app-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Animasi Pemuatan Sistem -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="loading-title">Memuat Sistem SIDALMAS...</div>
        <div class="loading-desc">Menghubungkan ke server Google Apps Script</div>
    </div>

    <!-- Iframe Web App Google Apps Script -->
    <iframe 
        id="app-frame"
        src="https://script.google.com/macros/s/AKfycbxDI-UESilWwdkiPbkQa-cVJ7nI3as8gLYaYbHX64T7R-_ECRe_MaTJoiHvSZ5R1pBn2w/exec"
        allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen"
        allowfullscreen>
    </iframe>

    <script>
        const iframe = document.getElementById('app-frame');
        const loadingScreen = document.getElementById('loading-screen');

        // Hilangkan loading screen setelah aplikasi selesai dimuat
        iframe.onload = function() {
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
                loadingScreen.style.visibility = 'hidden';
            }, 500);
        };

        // Fallback otomatis: jika koneksi lambat, layar tetap terbuka setelah 8 detik
        setTimeout(() => {
            if (loadingScreen.style.visibility !== 'hidden') {
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.visibility = 'hidden';
                }, 500);
            }
        }, 8000);
    </script>
</body>
</html>
