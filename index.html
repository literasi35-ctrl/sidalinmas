<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Informasi SIDALMAS</title>

    <!-- 1. OPTIMASI KONEKSI: Preconnect ke server Google agar pemuatan iframe jauh lebih cepat -->
    <link rel="preconnect" href="https://script.google.com" crossorigin>
    <link rel="dns-prefetch" href="https://script.google.com">
    <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
    <link rel="dns-prefetch" href="https://script.googleusercontent.com">

    <!-- 2. OPTIMASI FAVICON: Menggunakan thumbnail kecil (120px) bukan gambar resolusi 960px yang sangat berat -->
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Linmas_Logo.png/120px-Linmas_Logo.png">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        /* Layar Loading dengan Akselerasi GPU & Isolation Render */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #ffffff;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            will-change: opacity, visibility;
            contain: strict; /* Mengisolasi elemen dari reflow browser untuk menghemat CPU */
        }

        /* Saat tersembunyi, langsung dihilangkan dari rendering tree */
        #loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            display: none !important;
        }
        
        /* Animasi Spinner menggunakan Hardware Acceleration (GPU) */
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top: 4px solid #0d9488;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 18px;
            transform: translateZ(0); /* Memaksa diproses oleh GPU agar tidak patah-patah */
            will-change: transform;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #f8fafc;
        }
        
        .loading-desc {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 6px;
        }
        
        /* Frame Aplikasi */
        #app-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background-color: #0f172a;
        }
    </style>
</head>
<body>

    <!-- Animasi Pemuatan Sistem -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="loading-title">Memuat Sistem SIDALMAS...</div>
        <div class="loading-desc">Menghubungkan ke server Google Apps Script</div>
    </div>

    <!-- Iframe Web App Google Apps Script -->
    <iframe 
        id="app-frame"
        src="https://script.google.com/macros/s/AKfycbxDI-UESilWwdkiPbkQa-cVJ7nI3as8gLYaYbHX64T7R-_ECRe_MaTJoiHvSZ5R1pBn2w/exec"
        allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen"
        loading="eager"
        title="SIDALMAS System"
        allowfullscreen>
    </iframe>

    <script>
        (function() {
            const iframe = document.getElementById('app-frame');
            const loadingScreen = document.getElementById('loading-screen');
            let timeoutId = null;

            function hideLoading() {
                if (!loadingScreen || loadingScreen.classList.contains('hidden')) return;
                
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                }, 400);

                // Hapus timer fallback agar menghemat memory/process
                if (timeoutId) {
                    clearTimeout(timeoutId);
                    timeoutId = null;
                }
            }

            // Event listener yang lebih stabil
            iframe.addEventListener('load', hideLoading);

            // Fallback otomatis: jika koneksi lambat, hilangkan loading setelah 7 detik
            timeoutId = setTimeout(hideLoading, 7000);
        })();
    </script>
</body>
</html>
